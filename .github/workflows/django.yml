name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_todo
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: テストの実行
        env:
          SECRET_KEY: 'django-insecure-test-secret-key'
          DEBUG: 'True'
          POSTGRES_DB: django_todo
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          DATABASE_HOST: localhost  # ← 追加
        run: pytest