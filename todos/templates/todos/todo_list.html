<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ToDoリスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <!-- ↓ ナビゲーションバー追加：新規追加 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📝 ToDoリスト</h1>
            <div>
                <span class="me-3">{{ request.user.username }}さん</span>
                <form method="POST" action="{% url 'logout' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
                </form>
            </div>
        </div>
        <!-- ↑ ナビゲーションバー追加 -->

        <a href="{% url 'todo_create' %}" class="btn btn-primary mb-3">＋ 新しいTodoを追加</a>

        <ul class="list-group">
            {% for todo in todos %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>
                        {% if todo.completed %}
                            <s class="text-muted">{{ todo.title }}</s>
                        {% else %}
                            {{ todo.title }}
                        {% endif %}
                    </span>
                    <div class="d-flex gap-2">
                        <form method="POST" action="{% url 'todo_complete' todo.pk %}">
                            {% csrf_token %}
                            {% if todo.completed %}
                                <button type="submit" class="btn btn-sm btn-secondary">未完了に戻す</button>
                            {% else %}
                                <button type="submit" class="btn btn-sm btn-success">完了</button>
                            {% endif %}
                        </form>
                        <a href="{% url 'todo_delete' todo.pk %}" class="btn btn-sm btn-danger">削除</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
