<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Todo追加</title>
    <!-- BootstrapのCDNを追加：新規追加 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">➕ Todo追加</h1>
        <!-- クラス追加のみ -->
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="title" class="form-control" placeholder="タスクを入力">
            </div>
            <button type="submit" class="btn btn-primary">追加</button>
            <a href="{% url 'todo_list' %}" class="btn btn-secondary">キャンセル</a>
        </form>
    </div>
</body>
</html>
